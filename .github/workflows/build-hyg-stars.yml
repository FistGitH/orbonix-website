name: Build HYG Star Catalog
on:
  push:
    paths:
      - '.github/workflows/build-hyg-stars.yml'
      - 'scripts/build-hyg-stars.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned HYG v4.1
        run: |
          curl --fail --location --retry 3 --output /tmp/hygdata_v41.csv https://raw.githubusercontent.com/astronexus/HYG-Database/main/hyg/CURRENT/hygdata_v41.csv
          test $(wc -c < /tmp/hygdata_v41.csv) -gt 30000000
      - name: Pack magnitude-limited WebGL catalog
        run: node scripts/build-hyg-stars.cjs /tmp/hygdata_v41.csv data/hyg-stars.bin data/hyg-stars-meta.json
      - name: Validate generated catalog
        run: |
          test -s data/hyg-stars.bin
          node -e "const m=require('./data/hyg-stars-meta.json'); if(m.count<30000) throw Error('Unexpectedly small HYG catalog: '+m.count); console.log(m)"
      - name: Commit generated catalog
        run: |
          git config user.name "orbonix-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hyg-stars.bin data/hyg-stars-meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Build real HYG WebGL star catalog"
          git push
